[project]
name = "semaphore-core"
version = "0.0.1"
description = "Shared experiment interfaces for the Semaphore LAN word game"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[build-system]
requires = ["uv_build==0.9.18"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
    "uv_build==0.9.18",
]

[tool.uv.build-backend]
module-root = "packages"
module-name = "semaphore_core"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
