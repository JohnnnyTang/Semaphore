name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.9.18'
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Lint Python
        run: uv run --no-sync ruff check .
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check .

  test:
    name: Tests and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Test browser transport and state
        run: node --test tests/web/client.test.mjs
      - name: Validate gameplay specification fixtures
        run: |
          uv run --no-sync python fixtures/game_traces/validate.py
          uv run --no-sync python -m unittest discover -s fixtures/game_traces -p 'test_*.py'
      - name: Validate semantic fixtures without model downloads
        run: |
          uv run --no-sync python experiments/model_eval/run.py validate
          uv run --no-sync python -m unittest discover -s experiments/model_eval -p 'test_*.py'
      - name: Validate draft schemas and manifest boundaries
        run: uv run --no-sync python fixtures/manifests/check_examples.py
      - name: Build source distribution and wheel
        run: uv build --no-build-isolation
      - name: Import the wheel outside the source environment
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          read -r python_version < .python-version
          python_version="${python_version%$'\r'}"
          uv run --isolated --no-project --python "$python_version" --with "${wheels[0]}" python -I -c "import semaphore_core"

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned actionlint
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            'actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
      - name: Validate workflows
        shell: bash
        run: '"$RUNNER_TEMP/actionlint" -color'
